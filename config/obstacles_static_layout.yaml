# Static three-body layout reconstructed from the reference image.
#
# The layout from the reference image is rotated +pi/2 counter-clockwise about
# its arithmetic centre. The whole group is then centred at (5, 0), eight metres
# straight ahead of the robot at (-3, 0) when launched with spawn_yaw:=0. One
# grid cell in the reference is treated as one metre. The zero yaw rotates the
# robot +pi/2 from its historical default yaw=-pi/2, so its forward axis is +X.
obstacle_controller:
  ros__parameters:
    obstacle_names: [blue_obs, orange_obs, green_obs]

    blue_obs:
      type: elliptic_cylinder
      radius_x: 2.0
      radius_y: 1.0
      height: 0.7
      mass: 15.0
      init_x: 4.666666666666667
      init_y: 2.3333333333333335
      init_yaw: 0.0
      trajectory: static
      color_r: 0.1
      color_g: 0.3
      color_b: 1.0

    orange_obs:
      type: cylinder
      radius: 1.0
      height: 0.7
      mass: 15.0
      init_x: 6.666666666666667
      init_y: -0.6666666666666666
      init_yaw: 1.5707963267948966
      trajectory: static
      color_r: 1.0
      color_g: 0.4
      color_b: 0.1

    green_obs:
      type: elliptic_cylinder
      radius_x: 2.5
      radius_y: 0.7
      height: 0.7
      mass: 15.0
      init_x: 3.666666666666667
      init_y: -1.6666666666666667
      init_yaw: 2.356194490192345
      trajectory: static
      color_r: 0.1
      color_g: 0.9
      color_b: 0.3
