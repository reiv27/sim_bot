# Approximation of the horizontal scan delivered to reactive_circumnav.
# Range noise is an experiment profile rather than the Mid-360 data-sheet
# curve: its 1-sigma error grows linearly from 0.005 m at 0.2 m to 0.02 m at
# 10 m and stays constant outside that interval. Angular sigma uses the
# conservative 0.15 degree Mid-360 specification boundary. Errors are
# independent, zero-mean Gaussian samples; the seed fixes the sequence only.
# Not a 3D non-repeating scan model; no material, fog, motion-distortion,
# systematic bias, or false-return model (their distributions are unspecified).
lidar_noise:
  ros__parameters:
    input_topic: /scan_raw
    output_topic: /scan
    reference_topic: /scan_reference
    output_samples: 360
    range_sigma_near: 0.005
    range_sigma_far: 0.02
    angular_sigma_deg: 0.15
    seed: 360
    audit_path: ''
